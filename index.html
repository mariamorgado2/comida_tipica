<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Comida Típica</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #fafafa;
      margin: 0;
      padding: 20px;
      text-align: center;
    }

    h1 {
      color: #333;
      margin-bottom: 25px;
      font-weight: 600;
    }

    table {
      margin: auto;
      border-collapse: collapse;
    }

    td {
      padding: 15px;
    }

    img {
      width: 200px;
      height: 130px;
      border-radius: 6px;
      border: 1px solid #ddd;
      transition: transform 0.2s;
    }

    img:hover {
      transform: scale(1.03);
    }

    .country {
      margin-top: 8px;
      font-size: 1rem;
      color: #444;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <h1>Comida Típica del Mundo</h1>

  <table>
    <tr>
      <td>
        <a href="espana.html">
          <img src="figuras/espana.png" alt="España">
        </a>
        <div class="country">España</div>
      </td>

      <td>
        <a href="italia.html">
          <img src="figuras/italia.png" alt="Italia">
        </a>
        <div class="country">Italia</div>
      </td>

      <td>
        <a href="japon.html">
          <img src="figuras/japon.png" alt="Japón">
        </a>
        <div class="country">Japón</div>
      </td>
    </tr>

    <tr>
      <td>
        <a href="argentina.html">
          <img src="figuras/argentina.png" alt="Argentina">
        </a>
        <div class="country">Argentina</div>
      </td>

      <td>
        <a href="lituania.html">
          <img src="figuras/lituania.png" alt="Lituania">
        </a>
        <div class="country">Lituania</div>
      </td>

      <td>
        <a href="mexico.html">
          <img src="figuras/mexico.png" alt="México">
        </a>
        <div class="country">México</div>
      </td>
    </tr>
  </table>

</body>
</html>
